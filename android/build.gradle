apply plugin: "com.android.library"

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace "com.waivpaykartasdk"

    compileSdkVersion safeExtGet('WaivpayKartaSdk_compileSdkVersion', 35)

    defaultConfig {
        minSdkVersion safeExtGet('WaivpayKartaSdk_minSdkVersion', 24)
        targetSdkVersion safeExtGet('WaivpayKartaSdk_targetSdkVersion', 35)
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        disable 'GradleCompatible'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    mavenLocal()
    maven {
        // All of React Native (JS, Obj-C sources, Android binaries) installed from npm
        url("$rootDir/../node_modules/react-native/android")
    }
    maven { url 'https://jitpack.io' }
    maven { url "file:/$rootDir/privateMavenRepository" }
    google()
    mavenCentral()
}

dependencies {
    //noinspection GradleDynamicVersion
    implementation "com.facebook.react:react-native:+"
    implementation 'androidx.annotation:annotation:1.3.0'
    implementation 'com.google.android.gms:play-services-tapandpay:18.2.0'
    implementation 'com.google.android.gms:play-services-base:18.0.1'
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
    implementation 'com.google.android.gms:play-services-wallet:19.1.0'
    implementation 'com.google.guava:guava:15.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:17.0.0'
    implementation 'com.riskified:android-sdk:1.9.1:googleNoLocation@aar'
}
